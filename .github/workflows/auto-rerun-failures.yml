name: Auto Rerun Failures

on:
  workflow_run:
    workflows: ["*"]
    types:
      - completed

jobs:
  rerun:
    # Only act on genuine failures from the first attempt.
    # This prevents infinite loops and avoids re-running cancelled / successful runs.
    if: >
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.run_attempt == 1 &&
      github.event.workflow_run.name != 'Auto Rerun Failures'
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - name: Re-run failed jobs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          echo "Triggering re-run of failed jobs for run ${{ github.event.workflow_run.id }}"
          echo "Workflow: ${{ github.event.workflow_run.name }}"
          echo "Attempt: ${{ github.event.workflow_run.run_attempt }}"
          gh run rerun "${{ github.event.workflow_run.id }}" --failed
