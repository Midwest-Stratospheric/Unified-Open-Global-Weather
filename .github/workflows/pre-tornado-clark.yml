name: Pre-Tornado Clark County

on:
  schedule:
    - cron: "10 * * * *"
    - cron: "40 * * * *"
  workflow_dispatch:

concurrency:
  group: uogw-pre-tornado-clark
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  pre-tornado:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install matplotlib
        run: pip install matplotlib --quiet

      - name: Run Clark County pre-tornado screen
        run: python3 scripts/pre_tornado_clark.py

      - name: Commit
        run: |
          set -e
          git config user.name "uogw-bot"
          git config user.email "bot@midwestsds.com"
          git add data/entries data/latest layers/hazards visuals status || true
          if git diff --staged --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "data(hazards): Clark County pre-tornado research update $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3 4 5; do
            git fetch origin main
            git rebase origin/main || { git rebase --abort || true; git pull --rebase origin main || true; }
            if git push origin HEAD:main; then exit 0; fi
            sleep $((i * 2))
          done
          exit 1
