# Builds a research-ready daily package from all UOGW indexes + observations
# Runs after other daily jobs (09:00 UTC) so upstream files exist
# Scientific features run in scientific-features-daily.yml at 09:30 UTC
name: Daily Research Package

on:
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch:

concurrency:
  group: uogw-research-package
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    env:
      SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build research package
        run: |
          set -e
          DATE=$(date -u +%Y-%m-%d)
          mkdir -p data/entries/${DATE} data/latest status snapshots/${DATE} layers/research
          if [ -f scripts/build_research_package.py ]; then
            python3 scripts/build_research_package.py
          else
            echo "WARNING: scripts/build_research_package.py missing — using last committed data/latest"
            echo "Re-add full builder from git history commit 67e33c46 if needed."
          fi

      - name: Commit research data entry
        run: |
          set -e
          git config user.name "uogw-bot"
          git config user.email "bot@midwestsds.com"
          git add data/entries data/latest layers/research snapshots status || true
          if git diff --staged --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "data(research): daily science package + multi-source summary $(date -u +%Y-%m-%d)"
          for i in 1 2 3 4 5; do
            git fetch origin main
            git rebase origin/main || { git rebase --abort || true; git pull --rebase origin main || true; }
            if git push origin HEAD:main; then echo "Pushed OK"; exit 0; fi
            sleep $((i * 3))
          done
          exit 1

      - name: Prepare daily digest email
        id: mail
        run: |
          DATE_UTC=$(date -u +%Y-%m-%d)
          echo "date_utc=$DATE_UTC" >> "$GITHUB_OUTPUT"
          python3 << 'PY'
          import json
          from datetime import datetime, timezone

          def load(p):
              try:
                  with open(p) as f:
                      return json.load(f)
              except Exception:
                  return {}

          now = datetime.now(timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ")
          date = datetime.now(timezone.utc).strftime("%Y-%m-%d")
          s = load("data/latest/research-summary.json")
          a = load("data/latest/anomaly-report.json")
          sc = load("data/latest/scientific_scorecard_latest.json")
          obs = s.get("observations_today") or {}
          idx = s.get("indexes") or {}
          der = s.get("derived_surface_stats") or {}
          gtemp = der.get("global_city_temperature_c") or {}
          casey = der.get("casey_temperature_c") or {}
          counts = a.get("counts") or {}

          lines = [
              "Unified Open Global Weather (UOGW) — daily research package digest",
              f"Generated (UTC): {now}",
              f"Date: {date}",
              "GitHub: https://github.com/Midwest-Stratospheric/Unified-Open-Global-Weather",
              "",
              "OBSERVATIONS",
              f"  Global cities OK:     {obs.get('global_cities_ok', '—')}",
              f"  NDBC realtime:       {obs.get('ndbc_realtime_stations', '—')}",
              f"  Casey hourly:        {obs.get('casey_hourly_count', '—')}",
              f"  Climate cities OK:   {obs.get('research_daily_climate_cities', '—')}",
              "",
              "SCIENTIFIC SCORECARD",
              f"  Grade: {sc.get('grade', '—')}  composite={sc.get('composite_score', '—')}",
              "",
              "ANOMALIES (research only)",
              f"  Alert={counts.get('alert', 0)}  Watch={counts.get('watch', 0)}  Total={counts.get('total', 0)}",
              "",
              "Midwest Stratospheric Data Systems · launchcontrol@midwestsds.com",
          ]
          with open("/tmp/uogw-daily-email.txt", "w") as f:
              f.write("\n".join(lines) + "\n")
          PY

      - name: Email daily research digest
        if: env.SMTP_PASSWORD != ''
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.hostinger.com
          server_port: 465
          secure: true
          username: ${{ env.SMTP_USERNAME }}
          password: ${{ env.SMTP_PASSWORD }}
          subject: UOGW Daily Digest — ${{ steps.mail.outputs.date_utc }}
          to: launchcontrol@midwestsds.com
          from: UOGW Automation <launchcontrol@midwestsds.com>
          reply_to: launchcontrol@midwestsds.com
          body: file:///tmp/uogw-daily-email.txt
          content_type: text/plain
