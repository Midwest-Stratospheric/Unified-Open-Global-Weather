name: Weekly UOGW Release

# One pinned snapshot per ISO week: tag + Release with data/visuals zip + email notice.

on:
  schedule:
    - cron: "0 12 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: uogw-weekly-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute tag and package assets
        id: meta
        run: |
          set -euo pipefail
          WEEK=$(date -u +%G-W%V)
          TAG="uogw-${WEEK}"
          DATE_UTC=$(date -u +%Y-%m-%d)
          PKG="uogw-release-${WEEK}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "week=$WEEK" >> "$GITHUB_OUTPUT"
          echo "date_utc=$DATE_UTC" >> "$GITHUB_OUTPUT"
          echo "pkg=$PKG" >> "$GITHUB_OUTPUT"

          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

          mkdir -p "/tmp/${PKG}/reports" "/tmp/${PKG}/visuals" "/tmp/${PKG}/data-latest" "/tmp/${PKG}/status" "/tmp/${PKG}/docs"

          cp -a reports/. "/tmp/${PKG}/reports/" 2>/dev/null || true

          if [ -d visuals/latest ]; then cp -a visuals/latest/. "/tmp/${PKG}/visuals/"; fi
          if [ -f visuals/CHART_DESCRIPTIONS.md ]; then cp visuals/CHART_DESCRIPTIONS.md "/tmp/${PKG}/docs/"; fi
          if [ -f visuals/ANOMALY_GUIDE.md ]; then cp visuals/ANOMALY_GUIDE.md "/tmp/${PKG}/docs/"; fi
          if [ -f docs/DATA_PACKAGES.md ]; then cp docs/DATA_PACKAGES.md "/tmp/${PKG}/docs/"; fi

          # Latest science / research packages (not full historical entries tree)
          if [ -d data/latest ]; then cp -a data/latest/. "/tmp/${PKG}/data-latest/"; fi
          if [ -d status ]; then cp -a status/. "/tmp/${PKG}/status/" 2>/dev/null || true; fi

          {
            echo "UOGW weekly release package"
            echo "tag: ${TAG}"
            echo "week: ${WEEK}"
            echo "generated_utc: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "commit: $(git rev-parse HEAD)"
            echo ""
            echo "contents:"
            (cd "/tmp/${PKG}" && find . -type f | sort)
          } > "/tmp/${PKG}/PACKAGE_CONTENTS.txt"

          (cd /tmp && zip -r -q "${PKG}.zip" "${PKG}")
          ls -lh "/tmp/${PKG}.zip"

          {
            echo "## Unified Open Global Weather — weekly snapshot ${WEEK}"
            echo ""
            echo "**Tag:** \"${TAG}\"  "
            echo "**Date (UTC):** ${DATE_UTC}  "
            echo "**Commit:** $(git rev-parse --short HEAD)"
            echo ""
            echo "Attached: **${PKG}.zip** — weekly reports, °F charts/visuals, data/latest science packages, and status snapshots."
            echo ""
            echo "Open atmospheric data commons. Research screening — not an official warning product."
            echo ""
            echo "### Online pointers"
            echo "- [Latest weekly report](https://github.com/Midwest-Stratospheric/Unified-Open-Global-Weather/blob/main/reports/latest.md)"
            echo "- [Charts gallery](https://github.com/Midwest-Stratospheric/Unified-Open-Global-Weather/tree/main/visuals/latest)"
            echo "- [Science package](https://github.com/Midwest-Stratospheric/Unified-Open-Global-Weather/blob/main/data/latest/science-package.json)"
            echo ""
            echo "### Latest status report (excerpt)"
            echo ""
            if [ -f reports/latest.md ]; then head -n 100 reports/latest.md; else echo "_(no reports/latest.md)_"; fi
            echo ""
            echo "---"
            echo "*Automated weekly release · Midwest Stratospheric Data Systems / UOGW*"
          } > /tmp/release-notes.md

      - name: Create GitHub Release with assets
        if: steps.meta.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: UOGW weekly ${{ steps.meta.outputs.week }}
          body_path: /tmp/release-notes.md
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            /tmp/${{ steps.meta.outputs.pkg }}.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare release email
        if: steps.meta.outputs.exists == 'false'
        run: |
          WEEK="${{ steps.meta.outputs.week }}"
          TAG="${{ steps.meta.outputs.tag }}"
          PKG="${{ steps.meta.outputs.pkg }}"
          {
            echo "Unified Open Global Weather (UOGW) — weekly release published"
            echo ""
            echo "Tag:    ${TAG}"
            echo "Week:   ${WEEK}"
            echo "Time:   $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo ""
            echo "Release page:"
            echo "https://github.com/Midwest-Stratospheric/Unified-Open-Global-Weather/releases/tag/${TAG}"
            echo ""
            echo "Asset: ${PKG}.zip"
            echo "  Includes: reports, °F charts/visuals, data/latest, status"
            echo ""
            echo "Data Hub: https://midwestsds.com/msds-data-hub.html"
            echo ""
            echo "────────────────────────────────────────"
            echo "Open atmospheric data commons. Research screening — not an official warning product."
            echo "Midwest Stratospheric Data Systems · launchcontrol@midwestsds.com"
          } > /tmp/uogw-release-email.txt

      - name: Email release notification
        if: steps.meta.outputs.exists == 'false' && env.SMTP_PASSWORD != ''
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.hostinger.com
          server_port: 465
          secure: true
          username: ${{ env.SMTP_USERNAME }}
          password: ${{ env.SMTP_PASSWORD }}
          subject: UOGW Release ${{ steps.meta.outputs.tag }} published
          to: launchcontrol@midwestsds.com
          from: UOGW Automation <launchcontrol@midwestsds.com>
          reply_to: launchcontrol@midwestsds.com
          body: file:///tmp/uogw-release-email.txt
          content_type: text/plain

      - name: Skip notice
        if: steps.meta.outputs.exists == 'true'
        run: echo "Release ${{ steps.meta.outputs.tag }} already exists; no action."
