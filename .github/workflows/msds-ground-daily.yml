# Independent daily automation: Casey, IL ground weather → msds-data
# Runs on GitHub Actions without depending on midwestsds.com
name: MSDS Ground Daily

on:
  schedule:
    - cron: "15 1 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  casey-daily:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout msds-data
        uses: actions/checkout@v4
        with:
          repository: Midwest-Stratospheric/msds-data
          token: ${{ secrets.MSDS_DATA_TOKEN || github.token }}
          path: msds-data

      - name: Fetch Open-Meteo archive for Casey
        env:
          LAT: "39.2992"
          LON: "-87.9925"
        run: |
          DATE=$(date -u -d "yesterday" +%Y-%m-%d 2>/dev/null || date -u -v-1d +%Y-%m-%d)
          echo "Building daily file for $DATE"
          URL="https://archive-api.open-meteo.com/v1/archive?latitude=${LAT}&longitude=${LON}&start_date=${DATE}&end_date=${DATE}&hourly=temperature_2m,relative_humidity_2m,dewpoint_2m,precipitation,weathercode,pressure_msl,surface_pressure,cloudcover,windspeed_10m,winddirection_10m,windgusts_10m&daily=temperature_2m_max,temperature_2m_min,temperature_2m_mean,precipitation_sum,windspeed_10m_max&timezone=America%2FChicago&windspeed_unit=ms"
          mkdir -p msds-data/ground-weather/daily
          curl -fsSL -A "Midwest-Stratospheric/UOGW-msds-ground-daily" "$URL" -o /tmp/om.json
          python3 << 'PY'
          import json, os
          from datetime import datetime, timezone
          date = os.popen("date -u -d yesterday +%Y-%m-%d 2>/dev/null || date -u -v-1d +%Y-%m-%d").read().strip()
          om = json.load(open("/tmp/om.json"))
          out = {
            "date": date,
            "site": {
              "name": "Casey, Illinois",
              "latitude": 39.2992,
              "longitude": -87.9925,
              "elevation_m": 200,
              "timezone": "America/Chicago"
            },
            "source": {
              "provider": "Open-Meteo",
              "license": "CC BY 4.0",
              "url": "https://open-meteo.com/",
              "retrieved_at_utc": datetime.now(timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
              "curator": "Midwest Stratospheric Data Systems"
            },
            "hourly": om.get("hourly", {}),
            "daily": om.get("daily", {}),
            "meta": {"generator": "uogw/msds-ground-daily", "uogw": True}
          }
          path = f"msds-data/ground-weather/daily/{date}.json"
          with open(path, "w") as f:
            json.dump(out, f, indent=2)
          print("Wrote", path)
          PY

      - name: Commit if changed
        working-directory: msds-data
        run: |
          git config user.name "msds-bot"
          git config user.email "bot@midwestsds.com"
          git add ground-weather/daily || true
          if git diff --staged --quiet; then
            echo "No changes"
          else
            git commit -m "chore(ground): daily Casey weather $(date -u +%Y-%m-%d)"
            git push
          fi
