# Daily Casey IL ground OBSERVATIONS (hourly + daily) — dual-write msds-data + UOGW data/entries
name: MSDS Ground Daily

on:
  schedule:
    - cron: "15 6 * * *"
  workflow_dispatch:

concurrency:
  group: uogw-msds-ground
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  ground:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: uogw
          fetch-depth: 0

      - name: Checkout msds-data (optional)
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          repository: Midwest-Stratospheric/msds-data
          path: msds-data
          token: ${{ secrets.MSDS_DATA_TOKEN }}
          fetch-depth: 0

      - name: Fetch Casey hourly observations
        run: |
          set -e
          DATE=$(date -u -d yesterday +%Y-%m-%d 2>/dev/null || date -u -v-1d +%Y-%m-%d)
          LAT=39.2992
          LON=-87.9925
          URL="https://api.open-meteo.com/v1/forecast?latitude=${LAT}&longitude=${LON}&start_date=${DATE}&end_date=${DATE}&hourly=temperature_2m,relative_humidity_2m,dewpoint_2m,precipitation,weathercode,pressure_msl,surface_pressure,cloudcover,windspeed_10m,winddirection_10m,windgusts_10m&daily=temperature_2m_max,temperature_2m_min,temperature_2m_mean,precipitation_sum,windspeed_10m_max&timezone=America%2FChicago&windspeed_unit=ms"
          curl -fsSL -A "Midwest-Stratospheric/UOGW-msds-ground-daily" "$URL" -o /tmp/om.json
          python3 << 'PY'
          import json, os
          from datetime import datetime, timezone
          date = os.popen("date -u -d yesterday +%Y-%m-%d 2>/dev/null || date -u -v-1d +%Y-%m-%d").read().strip()
          om = json.load(open("/tmp/om.json"))
          now = datetime.now(timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ")
          hourly = om.get("hourly") or {}
          times = hourly.get("time") or []
          observations = []
          for i, t in enumerate(times):
              observations.append({
                  "time": t,
                  "temperature_c": (hourly.get("temperature_2m") or [None])[i] if i < len(hourly.get("temperature_2m") or []) else None,
                  "relative_humidity_pct": (hourly.get("relative_humidity_2m") or [None])[i] if i < len(hourly.get("relative_humidity_2m") or []) else None,
                  "dewpoint_c": (hourly.get("dewpoint_2m") or [None])[i] if i < len(hourly.get("dewpoint_2m") or []) else None,
                  "precipitation_mm": (hourly.get("precipitation") or [None])[i] if i < len(hourly.get("precipitation") or []) else None,
                  "weather_code": (hourly.get("weathercode") or [None])[i] if i < len(hourly.get("weathercode") or []) else None,
                  "pressure_msl_hpa": (hourly.get("pressure_msl") or [None])[i] if i < len(hourly.get("pressure_msl") or []) else None,
                  "cloudcover_pct": (hourly.get("cloudcover") or [None])[i] if i < len(hourly.get("cloudcover") or []) else None,
                  "wind_speed_ms": (hourly.get("windspeed_10m") or [None])[i] if i < len(hourly.get("windspeed_10m") or []) else None,
                  "wind_direction_deg": (hourly.get("winddirection_10m") or [None])[i] if i < len(hourly.get("winddirection_10m") or []) else None,
                  "wind_gust_ms": (hourly.get("windgusts_10m") or [None])[i] if i < len(hourly.get("windgusts_10m") or []) else None,
              })
          out = {
            "date": date,
            "site": {
              "name": "Casey, Illinois",
              "latitude": 39.2992,
              "longitude": -87.9925,
              "elevation_m": 200,
              "timezone": "America/Chicago"
            },
            "source": {
              "provider": "Open-Meteo",
              "license": "CC BY 4.0",
              "url": "https://open-meteo.com/",
              "retrieved_at_utc": now,
              "curator": "Midwest Stratospheric Data Systems"
            },
            "data_kind": "observations",
            "observation_count": len(observations),
            "observations": observations,
            "hourly": hourly,
            "daily": om.get("daily", {}),
            "meta": {"generator": "uogw/msds-ground-daily", "uogw": True}
          }

          os.makedirs("uogw/layers/ground/casey/daily", exist_ok=True)
          os.makedirs(f"uogw/data/entries/{date}", exist_ok=True)
          os.makedirs("uogw/data/latest", exist_ok=True)
          os.makedirs("uogw/status", exist_ok=True)

          for path in [
              f"uogw/layers/ground/casey/daily/{date}.json",
              "uogw/layers/ground/casey/latest.json",
              f"uogw/data/entries/{date}/casey-hourly.json",
              "uogw/data/latest/casey-hourly.json",
          ]:
              with open(path, "w") as f:
                  json.dump(out, f, indent=2)
              print("Wrote", path)

          if os.path.isdir("msds-data"):
              os.makedirs("msds-data/ground-weather/daily", exist_ok=True)
              with open(f"msds-data/ground-weather/daily/{date}.json", "w") as f:
                  json.dump(out, f, indent=2)

          summary_path = f"uogw/data/entries/{date}/summary.json"
          summary = {}
          if os.path.exists(summary_path):
              try:
                  summary = json.load(open(summary_path))
              except Exception:
                  summary = {}
          summary.setdefault("date", date)
          summary.setdefault("generated_at_utc", now)
          summary.setdefault("entries", {})
          summary["entries"]["casey-hourly"] = {
              "ok": len(observations) > 0,
              "observation_count": len(observations),
              "file": f"data/entries/{date}/casey-hourly.json",
          }
          with open(summary_path, "w") as f:
              json.dump(summary, f, indent=2)
          with open("uogw/data/latest/summary.json", "w") as f:
              json.dump(summary, f, indent=2)

          with open("uogw/status/msds-ground.json", "w") as f:
              json.dump({
                  "source": "msds-casey-ground",
                  "ok": True,
                  "date": date,
                  "observation_count": len(observations),
                  "data_entry": f"data/entries/{date}/casey-hourly.json",
                  "generated_at_utc": now,
              }, f, indent=2)
          print(f"DATA ENTRY: {len(observations)} hourly obs -> data/entries/{date}/casey-hourly.json")
          PY

      - name: Commit UOGW data entry
        working-directory: uogw
        run: |
          set -e
          git config user.name "uogw-bot"
          git config user.email "bot@midwestsds.com"
          git add layers/ground/casey data/entries data/latest status || true
          if git diff --staged --quiet; then
            echo "No changes"
            exit 0
          fi
          OBS=$(python3 -c "import json; d=json.load(open('status/msds-ground.json')); print(d.get('observation_count',0))" 2>/dev/null || echo 0)
          git commit -m "data(casey): ${OBS} hourly ground observations $(date -u +%Y-%m-%d)"
          for i in 1 2 3 4 5; do
            git fetch origin main
            git rebase origin/main || { git rebase --abort || true; git pull --rebase origin main || true; }
            if git push origin HEAD:main; then echo "Pushed OK"; exit 0; fi
            sleep $((i * 3))
          done
          exit 1

      - name: Commit msds-data (optional)
        continue-on-error: true
        working-directory: msds-data
        run: |
          set -e
          if [ ! -d .git ]; then echo "msds-data not checked out"; exit 0; fi
          git config user.name "uogw-bot"
          git config user.email "bot@midwestsds.com"
          git add ground-weather/daily || true
          if git diff --staged --quiet; then exit 0; fi
          git commit -m "data(casey): daily ground observations $(date -u +%Y-%m-%d)"
          git pull --rebase origin main || true
          git push origin HEAD:main || true
