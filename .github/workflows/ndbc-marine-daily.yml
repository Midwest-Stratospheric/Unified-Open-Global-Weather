# Daily NOAA NDBC station inventory + sample realtime observations
name: NDBC Marine Daily

on:
  schedule:
    - cron: "45 7 * * *"
  workflow_dispatch:

concurrency:
  group: uogw-ndbc
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  ndbc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch NDBC station table + sample obs
        run: |
          set -e
          DATE=$(date -u +%Y-%m-%d)
          mkdir -p layers/marine/ndbc snapshots/${DATE} status
          curl -fsSL -A "Midwest-Stratospheric/UOGW-ndbc" \
            "https://www.ndbc.noaa.gov/data/stations/station_table.txt" \
            -o /tmp/station_table.txt

          # Sample a few well-known stations for chartable snippets
          for SID in 41001 46026 44025 42040 46013; do
            curl -fsSL -A "Midwest-Stratospheric/UOGW-ndbc" \
              "https://www.ndbc.noaa.gov/data/realtime2/${SID}.txt" \
              -o /tmp/ndbc_${SID}.txt || true
          done

          python3 << 'PY'
          import json, os
          from datetime import datetime, timezone

          date = datetime.now(timezone.utc).strftime("%Y-%m-%d")
          now = datetime.now(timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ")
          stations = []
          path = "/tmp/station_table.txt"
          with open(path, encoding="utf-8", errors="ignore") as f:
              for line in f:
                  line = line.strip()
                  if not line or line.startswith("#"):
                      continue
                  parts = [p.strip() for p in line.split("|")]
                  if len(parts) < 5:
                      continue
                  stations.append({
                      "id": parts[0],
                      "owner": parts[1] if len(parts) > 1 else None,
                      "type": parts[2] if len(parts) > 2 else None,
                      "hull": parts[3] if len(parts) > 3 else None,
                      "name": parts[4] if len(parts) > 4 else None,
                      "realtime_txt": f"https://www.ndbc.noaa.gov/data/realtime2/{parts[0]}.txt"
                  })

          samples = {}
          for sid in ["41001", "46026", "44025", "42040", "46013"]:
              p = f"/tmp/ndbc_{sid}.txt"
              if not os.path.exists(p):
                  continue
              lines = open(p, encoding="utf-8", errors="ignore").read().splitlines()
              # keep header + last ~24 data rows
              data_lines = [ln for ln in lines if ln and not ln.startswith("#")]
              samples[sid] = {
                  "source": f"https://www.ndbc.noaa.gov/data/realtime2/{sid}.txt",
                  "rows": data_lines[:2] + data_lines[-24:] if len(data_lines) > 26 else data_lines,
              }

          doc = {
              "generated_at_utc": now,
              "date": date,
              "product": "NDBC station_table index",
              "authoritative": "https://www.ndbc.noaa.gov/",
              "station_count": len(stations),
              "stations": stations,
              "sample_realtime": samples,
              "note": "Full observations remain at NDBC. Samples are for hub visualization.",
              "curator": "Midwest Stratospheric Data Systems / UOGW",
          }

          def write(path, obj):
              os.makedirs(os.path.dirname(path), exist_ok=True)
              with open(path, "w") as f:
                  json.dump(obj, f, indent=2)

          write(f"layers/marine/ndbc/stations-{date}.json", doc)
          write("layers/marine/ndbc/stations-latest.json", doc)
          write(f"snapshots/{date}/ndbc-stations.json", doc)
          write("status/ndbc.json", {
              "source": "ndbc",
              "ok": True,
              "station_count": len(stations),
              "sample_stations": list(samples.keys()),
              "generated_at_utc": now,
          })
          print("stations", len(stations), "samples", list(samples.keys()))
          PY

      - name: Commit
        run: |
          git config user.name "uogw-bot"
          git config user.email "bot@midwestsds.com"
          git pull --rebase origin main || true
          git add layers/marine/ndbc snapshots status || true
          if git diff --staged --quiet; then
            echo "No changes"
          else
            git commit -m "chore(ndbc): daily station index + samples $(date -u +%Y-%m-%d)"
            git push
          fi
