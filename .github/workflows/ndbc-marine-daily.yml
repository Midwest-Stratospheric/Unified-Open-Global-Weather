# Independent daily automation: NOAA NDBC station inventory + sample latest links
name: NDBC Marine Daily

on:
  schedule:
    - cron: "45 7 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ndbc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch NDBC station table
        run: |
          DATE=$(date -u +%Y-%m-%d)
          mkdir -p layers/marine/ndbc snapshots/${DATE} status
          curl -fsSL -A "Midwest-Stratospheric/UOGW-ndbc" \
            "https://www.ndbc.noaa.gov/data/stations/station_table.txt" \
            -o /tmp/station_table.txt || true
          python3 << 'PY'
          import json, os
          from datetime import datetime, timezone
          date = datetime.now(timezone.utc).strftime("%Y-%m-%d")
          stations = []
          path = "/tmp/station_table.txt"
          if os.path.exists(path):
              with open(path, encoding="utf-8", errors="ignore") as f:
                  for i, line in enumerate(f):
                      line = line.strip()
                      if not line or line.startswith("#"):
                          continue
                      parts = [p.strip() for p in line.split("|")]
                      if len(parts) < 5:
                          continue
                      stations.append({
                          "id": parts[0],
                          "owner": parts[1] if len(parts) > 1 else None,
                          "type": parts[2] if len(parts) > 2 else None,
                          "hull": parts[3] if len(parts) > 3 else None,
                          "name": parts[4] if len(parts) > 4 else None,
                          "payload_raw": parts,
                          "realtime_txt": f"https://www.ndbc.noaa.gov/data/realtime2/{parts[0]}.txt"
                      })
          doc = {
            "generated_at_utc": datetime.now(timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
            "date": date,
            "product": "NDBC station_table index",
            "authoritative": "https://www.ndbc.noaa.gov/",
            "station_count": len(stations),
            "stations": stations,
            "note": "Index of public NDBC stations. Observations remain at NDBC.",
            "curator": "Midwest Stratospheric Data Systems / UOGW"
          }
          for p in [
              f"layers/marine/ndbc/stations-{date}.json",
              "layers/marine/ndbc/stations-latest.json",
              f"snapshots/{date}/ndbc-stations.json",
          ]:
              os.makedirs(os.path.dirname(p), exist_ok=True)
              with open(p, "w") as f:
                  json.dump(doc, f, indent=2)
          with open("status/ndbc.json", "w") as f:
              json.dump({"source": "ndbc", "ok": True, "station_count": len(stations), "generated_at_utc": doc["generated_at_utc"]}, f, indent=2)
          print("stations", len(stations))
          PY

      - name: Commit
        run: |
          git config user.name "uogw-bot"
          git config user.email "bot@midwestsds.com"
          git add layers/marine/ndbc snapshots status || true
          if git diff --staged --quiet; then
            echo "No changes"
          else
            git commit -m "chore(ndbc): daily station index $(date -u +%Y-%m-%d)"
            git push
          fi
