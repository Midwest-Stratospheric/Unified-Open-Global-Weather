name: fix-gmc-hourly-combined
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace placeholder combined hourly from HF
        run: |
          set -euo pipefail
          DEST=layers/ground/casey/gmc-800/hourly_2026-09-25_2026-10-09.csv
          curl -fsSL -o "$DEST" \
            "https://huggingface.co/datasets/aerostratospheric/uogw/resolve/main/layers/ground/casey/gmc-800/hourly_2026-09-25_2026-10-09.csv"
          test "$(wc -c < "$DEST")" -eq 23495
          head -1 "$DEST" | grep -q '^time_local,'
          tail -1 "$DEST" | grep -q '2026-10-09T09:00:00'
          git config user.name "gmc800-ground-ingest"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$DEST"
          git commit -m "data(casey-gmc-800): hourly series 2026-09-25 to 2026-10-09 (338 hours)"
          git push
