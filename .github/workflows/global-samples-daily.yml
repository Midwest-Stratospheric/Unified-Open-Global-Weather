# Daily multi-city surface samples (Open-Meteo) for hub charts / maps
name: Global Samples Daily

on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:

concurrency:
  group: uogw-global-samples
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  samples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch multi-city samples
        run: |
          set -e
          DATE=$(date -u +%Y-%m-%d)
          mkdir -p layers/ground/samples snapshots/${DATE} status
          python3 << 'PY'
          import json, os, urllib.request
          from datetime import datetime, timezone

          date = datetime.now(timezone.utc).strftime("%Y-%m-%d")
          now = datetime.now(timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ")
          cities = [
            {"id": "casey_il", "name": "Casey, IL", "lat": 39.2992, "lon": -87.9925, "tz": "America/Chicago"},
            {"id": "chicago_il", "name": "Chicago, IL", "lat": 41.8781, "lon": -87.6298, "tz": "America/Chicago"},
            {"id": "houston_tx", "name": "Houston, TX", "lat": 29.7604, "lon": -95.3698, "tz": "America/Chicago"},
            {"id": "london_uk", "name": "London, UK", "lat": 51.5074, "lon": -0.1278, "tz": "Europe/London"},
            {"id": "tokyo_jp", "name": "Tokyo, JP", "lat": 35.6762, "lon": 139.6503, "tz": "Asia/Tokyo"},
            {"id": "sydney_au", "name": "Sydney, AU", "lat": -33.8688, "lon": 151.2093, "tz": "Australia/Sydney"},
          ]
          results = []
          for c in cities:
              url = (
                  "https://api.open-meteo.com/v1/forecast"
                  f"?latitude={c['lat']}&longitude={c['lon']}"
                  "&current=temperature_2m,relative_humidity_2m,precipitation,weather_code,wind_speed_10m,wind_direction_10m,pressure_msl"
                  f"&timezone={urllib.parse.quote(c['tz'])}&wind_speed_unit=ms"
              )
              import urllib.parse
              url = (
                  "https://api.open-meteo.com/v1/forecast"
                  f"?latitude={c['lat']}&longitude={c['lon']}"
                  "&current=temperature_2m,relative_humidity_2m,precipitation,weather_code,wind_speed_10m,wind_direction_10m,pressure_msl"
                  f"&timezone={urllib.parse.quote(c['tz'])}&wind_speed_unit=ms"
              )
              try:
                  with urllib.request.urlopen(urllib.request.Request(url, headers={"User-Agent": "Midwest-Stratospheric/UOGW-samples"}), timeout=60) as r:
                      payload = json.loads(r.read().decode())
                  results.append({
                      **c,
                      "current": payload.get("current"),
                      "ok": True,
                  })
              except Exception as e:
                  results.append({**c, "ok": False, "error": str(e)})

          doc = {
              "generated_at_utc": now,
              "date": date,
              "product": "Global surface sample set (Open-Meteo current)",
              "license": "Open-Meteo CC BY 4.0",
              "city_count": len(results),
              "cities": results,
              "curator": "Midwest Stratospheric Data Systems / UOGW",
          }
          for p in [
              f"layers/ground/samples/cities-{date}.json",
              "layers/ground/samples/cities-latest.json",
              f"snapshots/{date}/global-city-samples.json",
          ]:
              os.makedirs(os.path.dirname(p), exist_ok=True)
              with open(p, "w") as f:
                  json.dump(doc, f, indent=2)
          with open("status/global-samples.json", "w") as f:
              json.dump({
                  "source": "open-meteo-samples",
                  "ok": any(x.get("ok") for x in results),
                  "city_count": len(results),
                  "ok_count": sum(1 for x in results if x.get("ok")),
                  "generated_at_utc": now,
              }, f, indent=2)
          print("cities", len(results), "ok", sum(1 for x in results if x.get("ok")))
          PY

      - name: Commit
        run: |
          git config user.name "uogw-bot"
          git config user.email "bot@midwestsds.com"
          git pull --rebase origin main || true
          git add layers/ground/samples snapshots status || true
          if git diff --staged --quiet; then
            echo "No changes"
          else
            git commit -m "chore(samples): daily global city surface set $(date -u +%Y-%m-%d)"
            git push
          fi
