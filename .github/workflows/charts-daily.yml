name: Charts Daily

# Fully automated chart generation from repo data
on:
  schedule:
    # After most daily producers (01:15–10:00 UTC) have finished
    - cron: "0 11 * * *"
    # Second pass in case morning jobs ran late
    - cron: "30 13 * * *"
  workflow_dispatch:
  # Rebuild charts when upstream data workflows complete successfully
  workflow_run:
    workflows:
      - Daily Research Package
      - Global Samples Daily
      - NDBC Marine Daily
      - MSDS Ground Daily
      - Anomaly Detection Daily
    types:
      - completed

concurrency:
  group: uogw-charts
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  charts:
    # For workflow_run events, only proceed if the upstream job succeeded
    if: >
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install matplotlib
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install matplotlib numpy

      - name: Generate charts (automated)
        run: |
          set -e
          python3 scripts/generate_charts.py

      - name: Commit chart artifacts
        run: |
          set -e
          git config user.name "uogw-bot"
          git config user.email "bot@midwestsds.com"
          git add visuals data/entries data/latest status || true
          if git diff --staged --quiet; then
            echo "No chart changes"
            exit 0
          fi
          git commit -m "data(visuals): automated charts $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3 4 5; do
            git fetch origin main
            git rebase origin/main || { git rebase --abort || true; git pull --rebase origin main || true; }
            if git push origin HEAD:main; then
              echo "Charts pushed"
              exit 0
            fi
            sleep $((i * 3))
          done
          exit 1
