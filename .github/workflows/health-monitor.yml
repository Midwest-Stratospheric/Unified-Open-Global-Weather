name: Health Monitor

on:
  schedule:
    - cron: "0 12 * * *"
    - cron: "0 18 * * *"
  workflow_dispatch:

concurrency:
  group: uogw-health
  cancel-in-progress: false

permissions:
  contents: write
  actions: write
  issues: write

jobs:
  health:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check data health, self-heal, plan interventions
        id: check
        run: |
          set -e
          python3 <<'PY'
          import json, os, shutil
          from datetime import datetime, timezone, timedelta

          now = datetime.now(timezone.utc)
          now_s = now.strftime("%Y-%m-%dT%H:%M:%SZ")
          date = now.strftime("%Y-%m-%d")
          os.makedirs(f"data/entries/{date}", exist_ok=True)
          os.makedirs("data/latest", exist_ok=True)
          os.makedirs("status", exist_ok=True)

          def load(p):
              if not os.path.exists(p):
                  return None
              try:
                  with open(p) as f:
                      return json.load(f)
              except Exception:
                  return None

          def age_hours(doc):
              if not isinstance(doc, dict):
                  return None
              for k in ("generated_at_utc", "fetched_at_utc", "retrieved_at_utc"):
                  v = doc.get(k)
                  if not v and isinstance(doc.get("source"), dict):
                      v = doc["source"].get(k)
                  if v:
                      try:
                          t = datetime.fromisoformat(v.replace("Z", "+00:00"))
                          return (now - t).total_seconds() / 3600.0
                      except Exception:
                          pass
              # nested cities
              cities = doc.get("cities") or []
              if cities and isinstance(cities[0], dict):
                  v = cities[0].get("fetched_at_utc")
                  if v:
                      try:
                          t = datetime.fromisoformat(v.replace("Z", "+00:00"))
                          return (now - t).total_seconds() / 3600.0
                      except Exception:
                          pass
              return None

          required = [
              {
                  "id": "global-cities",
                  "paths": ["data/latest/global-cities.json", "layers/ground/samples/cities-latest.json"],
                  "heal_from": "layers/ground/samples/cities-latest.json",
                  "heal_to": ["data/latest/global-cities.json"],
                  "max_age_h": 36,
                  "workflow": "global-samples-daily.yml",
                  "critical": True,
              },
              {
                  "id": "casey-hourly",
                  "paths": ["data/latest/casey-hourly.json", "layers/ground/casey/latest.json"],
                  "heal_from": "layers/ground/casey/latest.json",
                  "heal_to": ["data/latest/casey-hourly.json"],
                  "max_age_h": 48,
                  "workflow": "msds-ground-daily.yml",
                  "critical": True,
              },
              {
                  "id": "ndbc-realtime",
                  "paths": ["data/latest/ndbc-realtime.json", "layers/marine/ndbc/realtime-latest.json"],
                  "heal_from": "layers/marine/ndbc/realtime-latest.json",
                  "heal_to": ["data/latest/ndbc-realtime.json"],
                  "max_age_h": 36,
                  "workflow": "ndbc-marine-daily.yml",
                  "critical": True,
              },
              {
                  "id": "research-summary",
                  "paths": ["data/latest/research-summary.json", "layers/research/summary-latest.json"],
                  "heal_from": "layers/research/summary-latest.json",
                  "heal_to": ["data/latest/research-summary.json"],
                  "max_age_h": 36,
                  "workflow": "daily-research-package.yml",
                  "critical": True,
              },
              {
                  "id": "science-package",
                  "paths": ["data/latest/science-package.json"],
                  "heal_from": None,
                  "heal_to": [],
                  "max_age_h": 36,
                  "workflow": "daily-research-package.yml",
                  "critical": True,
              },
              {
                  "id": "anomaly-report",
                  "paths": ["data/latest/anomaly-report.json"],
                  "max_age_h": 36,
                  "workflow": "anomaly-detection-daily.yml",
                  "critical": False,
              },
              {
                  "id": "rolling-baseline",
                  "paths": ["data/latest/rolling-baseline.json"],
                  "max_age_h": 48,
                  "workflow": "rolling-baseline-daily.yml",
                  "critical": False,
              },
              {
                  "id": "satellite-index",
                  "paths": ["data/latest/satellite-radiance-index.json"],
                  "max_age_h": 48,
                  "workflow": "satellite-radiance-daily.yml",
                  "critical": False,
              },
              {
                  "id": "fair-metadata",
                  "paths": ["data/latest/fair-metadata.json"],
                  "max_age_h": 48,
                  "workflow": "fair-metadata-daily.yml",
                  "critical": False,
              },
              {
                  "id": "charts-markdown",
                  "paths": ["visuals/latest/CHARTS.md"],
                  "max_age_h": 48,
                  "workflow": "charts-daily.yml",
                  "critical": False,
                  "json": False,
              },
              {
                  "id": "catalog",
                  "paths": ["catalog/catalog.json"],
                  "max_age_h": None,
                  "workflow": None,
                  "critical": True,
              },
          ]

          results = []
          heal_actions = []
          redispatches = []
          critical_fail = False

          for item in required:
              found_path = None
              doc = None
              is_json = item.get("json", True)
              for p in item["paths"]:
                  if not os.path.exists(p):
                      continue
                  found_path = p
                  if is_json:
                      doc = load(p)
                      if doc is None and p.endswith(".json"):
                          found_path = None
                          continue
                  break

              # self-heal: copy alternate path into data/latest
              if item.get("heal_from") and os.path.exists(item["heal_from"]):
                  for dest in item.get("heal_to") or []:
                      if not os.path.exists(dest):
                          os.makedirs(os.path.dirname(dest), exist_ok=True)
                          shutil.copy2(item["heal_from"], dest)
                          heal_actions.append({"copied": item["heal_from"], "to": dest})
                          if dest in item["paths"] or True:
                              found_path = found_path or dest
                              if is_json:
                                  doc = load(dest)

              status = "ok"
              reasons = []
              if not found_path:
                  status = "missing"
                  reasons.append("file not found")
              elif is_json and doc is None:
                  status = "invalid_json"
                  reasons.append("could not parse JSON")
              else:
                  hrs = age_hours(doc) if is_json else None
                  max_age = item.get("max_age_h")
                  if max_age is not None and hrs is not None and hrs > max_age:
                      status = "stale"
                      reasons.append(f"age {hrs:.1f}h > {max_age}h")
                  elif max_age is not None and is_json and hrs is None and item.get("critical"):
                      # no timestamp but file exists — warn only
                      reasons.append("no timestamp; presence ok")

              if status != "ok" and item.get("workflow"):
                  redispatches.append(item["workflow"])
              if status in ("missing", "invalid_json") and item.get("critical"):
                  critical_fail = True
              if status == "stale" and item.get("critical"):
                  critical_fail = True

              results.append({
                  "id": item["id"],
                  "status": status,
                  "path": found_path,
                  "reasons": reasons,
                  "critical": item.get("critical", False),
                  "workflow": item.get("workflow"),
              })

          # de-dupe redispatches
          redispatches = sorted(set(redispatches))

          report = {
              "schema": "uogw.health_report.v1",
              "date_utc": date,
              "generated_at_utc": now_s,
              "ok": not critical_fail,
              "critical_fail": critical_fail,
              "checks": results,
              "heal_actions": heal_actions,
              "redispatch_workflows": redispatches,
              "summary": {
                  "total": len(results),
                  "ok": sum(1 for r in results if r["status"] == "ok"),
                  "missing": sum(1 for r in results if r["status"] == "missing"),
                  "stale": sum(1 for r in results if r["status"] == "stale"),
                  "invalid_json": sum(1 for r in results if r["status"] == "invalid_json"),
              },
              "curator": "Midwest Stratospheric Data Systems",
          }

          for p in [
              f"data/entries/{date}/health-report.json",
              "data/latest/health-report.json",
              "status/health.json",
          ]:
              with open(p, "w") as f:
                  json.dump(report, f, indent=2)

          # export for later steps
          with open("/tmp/health_report.json", "w") as f:
              json.dump(report, f, indent=2)
          with open("/tmp/redispatch.txt", "w") as f:
              f.write("\n".join(redispatches))

          print(json.dumps(report["summary"], indent=2))
          print("heal", heal_actions)
          print("redispatch", redispatches)
          if critical_fail:
              print("CRITICAL_FAIL=1")
          else:
              print("CRITICAL_FAIL=0")
          PY
          if grep -q 'CRITICAL_FAIL=1' <(python3 -c "import json;print('CRITICAL_FAIL=1' if json.load(open('/tmp/health_report.json'))['critical_fail'] else 'CRITICAL_FAIL=0')"); then
            echo "critical=true" >> "$GITHUB_OUTPUT"
          else
            echo "critical=false" >> "$GITHUB_OUTPUT"
          fi
          echo "redispatch_count=$(wc -l < /tmp/redispatch.txt | tr -d ' ')" >> "$GITHUB_OUTPUT"

      - name: Commit health report and healed files
        run: |
          set -e
          git config user.name "uogw-bot"
          git config user.email "bot@midwestsds.com"
          git add data/latest data/entries status || true
          if git diff --staged --quiet; then
            echo "No health commit changes"
            exit 0
          fi
          git commit -m "ops(health): daily health report + self-heal $(date -u +%Y-%m-%d)"
          for i in 1 2 3 4 5; do
            git fetch origin main
            git rebase origin/main || { git rebase --abort || true; git pull --rebase origin main || true; }
            if git push origin HEAD:main; then exit 0; fi
            sleep $((i * 3))
          done
          exit 1

      - name: Re-dispatch unhealthy workflows
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          if [ ! -s /tmp/redispatch.txt ]; then
            echo "No redispatches needed"
            exit 0
          fi
          while IFS= read -r wf; do
            [ -z "$wf" ] && continue
            echo "Dispatching $wf ..."
            curl -sS -X POST \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${{ github.repository }}/actions/workflows/${wf}/dispatches" \
              -d '{"ref":"main"}' || echo "dispatch failed for $wf"
            sleep 2
          done < /tmp/redispatch.txt

      - name: Open or update GitHub Issue on critical failure
        if: steps.check.outputs.critical == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const report = JSON.parse(fs.readFileSync('/tmp/health_report.json', 'utf8'));
            const title = 'UOGW health: critical data issue';
            const failed = report.checks.filter(c => c.status !== 'ok');
            const body = [
              '## Automated health monitor report',
              '',
              `Generated: **${report.generated_at_utc}**`,
              `Critical: **${report.critical_fail}**`,
              '',
              '### Summary',
              '```json',
              JSON.stringify(report.summary, null, 2),
              '```',
              '',
              '### Failed / stale checks',
              ...failed.map(c => `- **${c.id}**: \`${c.status}\` ${ (c.reasons||[]).join('; ') } path=${c.path||'none'} workflow=${c.workflow||'n/a'}`),
              '',
              '### Self-heal actions',
              '```json',
              JSON.stringify(report.heal_actions || [], null, 2),
              '```',
              '',
              '### Re-dispatched workflows',
              (report.redispatch_workflows || []).map(w => `- \`${w}\``).join('\n') || '_none_',
              '',
              'This issue was opened automatically by `health-monitor.yml`.',
              'It will be closed automatically when the next health run is fully OK.',
            ].join('\n');

            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'uogw-health',
              per_page: 10,
            });
            const existing = issues.data.find(i => i.title === title);
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body,
              });
              console.log('Updated issue', existing.number);
            } else {
              // ensure label exists
              try {
                await github.rest.issues.createLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  name: 'uogw-health',
                  color: 'FF6B6B',
                  description: 'Automated UOGW data health alerts',
                });
              } catch (e) {}
              const created = await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['uogw-health'],
              });
              console.log('Opened issue', created.data.number);
            }

      - name: Close health issue when recovered
        if: steps.check.outputs.critical != 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const title = 'UOGW health: critical data issue';
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'uogw-health',
              per_page: 10,
            });
            const existing = issues.data.find(i => i.title === title);
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body: 'Health monitor reports **recovered** (no critical failures). Closing automatically.',
              });
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                state: 'closed',
              });
              console.log('Closed issue', existing.number);
            } else {
              console.log('No open health issue');
            }
