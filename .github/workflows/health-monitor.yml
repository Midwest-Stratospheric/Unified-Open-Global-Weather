name: Health Monitor

on:
  schedule:
    - cron: "0 12 * * *"
    - cron: "0 18 * * *"
  workflow_dispatch:

concurrency:
  group: uogw-health
  cancel-in-progress: false

permissions:
  contents: write
  actions: write
  issues: write
  pull-requests: write

jobs:
  health:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Self-heal data/latest pointers
        run: |
          set -e
          python3 scripts/heal_latest.py

      - name: Evaluate health after heal
        id: check
        run: |
          set -e
          python3 <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path

          now = datetime.now(timezone.utc)
          now_s = now.strftime("%Y-%m-%dT%H:%M:%SZ")
          date = now.strftime("%Y-%m-%d")

          def load(p):
              path = Path(p)
              if not path.exists():
                  return None
              if path.suffix == ".md":
                  return {"_exists": True, "size": path.stat().st_size}
              try:
                  return json.loads(path.read_text())
              except Exception:
                  return False

          def age_hours(doc):
              if not isinstance(doc, dict):
                  return None
              for k in ("generated_at_utc", "fetched_at_utc", "retrieved_at_utc", "date_utc", "date"):
                  v = doc.get(k)
                  if not v and isinstance(doc.get("source"), dict):
                      v = doc["source"].get("retrieved_at_utc") or doc["source"].get(k)
                  if not v:
                      continue
                  try:
                      vs = str(v)
                      if len(vs) == 10 and vs[4] == "-":
                          t = datetime.fromisoformat(vs + "T12:00:00+00:00")
                      else:
                          t = datetime.fromisoformat(vs.replace("Z", "+00:00"))
                      return (now - t).total_seconds() / 3600.0
                  except Exception:
                      continue
              return None

          checks_spec = [
              ("global-cities", ["data/latest/global-cities.json"], 36, "global-samples-daily.yml", True),
              ("casey-hourly", ["data/latest/casey-hourly.json"], 48, "msds-ground-daily.yml", True),
              ("ndbc-realtime", ["data/latest/ndbc-realtime.json"], 36, "ndbc-marine-daily.yml", True),
              ("research-summary", ["data/latest/research-summary.json"], 36, "daily-research-package.yml", True),
              ("science-package", ["data/latest/science-package.json"], 36, "daily-research-package.yml", True),
              ("anomaly-report", ["data/latest/anomaly-report.json"], 36, "anomaly-detection-daily.yml", False),
              ("rolling-baseline", ["data/latest/rolling-baseline.json"], 48, "rolling-baseline-daily.yml", False),
              ("satellite-index", ["data/latest/satellite-radiance-index.json"], 48, "satellite-radiance-daily.yml", False),
              ("fair-metadata", ["data/latest/fair-metadata.json"], 48, "fair-metadata-daily.yml", False),
              ("charts-markdown", ["visuals/latest/CHARTS.md"], 48, "charts-daily.yml", False),
              ("catalog", ["catalog/catalog.json"], None, None, True),
          ]

          results = []
          redispatches = []
          critical_fail = False
          for cid, paths, max_age, workflow, critical in checks_spec:
              found = None
              doc = None
              status = "ok"
              reasons = []
              for p in paths:
                  doc = load(p)
                  if doc is False:
                      status = "invalid_json"
                      found = p
                      reasons.append("invalid JSON")
                      break
                  if doc is not None:
                      found = p
                      break
              if found is None and status == "ok":
                  status = "missing"
                  reasons.append("file not found")
              elif status == "ok" and max_age is not None:
                  hrs = age_hours(doc) if isinstance(doc, dict) else None
                  if hrs is not None and hrs > max_age:
                      status = "stale"
                      reasons.append(f"age {hrs:.1f}h > {max_age}h")
              if status != "ok" and workflow:
                  redispatches.append(workflow)
              if status in ("missing", "invalid_json", "stale") and critical:
                  critical_fail = True
              results.append({
                  "id": cid,
                  "status": status,
                  "path": found,
                  "reasons": reasons,
                  "critical": critical,
                  "workflow": workflow,
              })

          redispatches = sorted(set(redispatches))
          heal = {}
          if Path("status/heal.json").exists():
              try:
                  heal = json.loads(Path("status/heal.json").read_text())
              except Exception:
                  heal = {}

          report = {
              "schema": "uogw.health_report.v1",
              "date_utc": date,
              "generated_at_utc": now_s,
              "ok": not critical_fail,
              "critical_fail": critical_fail,
              "checks": results,
              "heal_actions": heal.get("actions") or [],
              "redispatch_workflows": redispatches,
              "summary": {
                  "total": len(results),
                  "ok": sum(1 for r in results if r["status"] == "ok"),
                  "missing": sum(1 for r in results if r["status"] == "missing"),
                  "stale": sum(1 for r in results if r["status"] == "stale"),
                  "invalid_json": sum(1 for r in results if r["status"] == "invalid_json"),
              },
              "alert_pr_branch": "ops/uogw-health-alert",
              "rollback_docs": "docs/ROLLBACK.md",
              "curator": "Midwest Stratospheric Data Systems",
          }

          Path(f"data/entries/{date}").mkdir(parents=True, exist_ok=True)
          Path("data/latest").mkdir(parents=True, exist_ok=True)
          Path("status").mkdir(parents=True, exist_ok=True)
          for p in [
              f"data/entries/{date}/health-report.json",
              "data/latest/health-report.json",
              "status/health.json",
          ]:
              Path(p).write_text(json.dumps(report, indent=2) + "\n")

          Path("/tmp/health_report.json").write_text(json.dumps(report, indent=2))
          Path("/tmp/redispatch.txt").write_text("\n".join(redispatches) + ("\n" if redispatches else ""))

          # Markdown log for the alert PR body/files
          failed = [c for c in results if c["status"] != "ok"]
          lines = [
              f"# UOGW Health Alert — {date}",
              "",
              f"Generated: `{now_s}`",
              f"Critical failure: **{critical_fail}**",
              "",
              "## Summary",
              "```json",
              json.dumps(report["summary"], indent=2),
              "```",
              "",
              "## Checks",
              "| ID | Status | Critical | Path | Reasons | Workflow |",
              "|----|--------|----------|------|---------|----------|",
          ]
          for c in results:
              lines.append(
                  f"| {c['id']} | `{c['status']}` | {c['critical']} | `{c.get('path') or ''}` | {'; '.join(c.get('reasons') or []) or '—'} | `{c.get('workflow') or '—'}` |"
              )
          lines += [
              "",
              "## Re-dispatch queue",
              "",
          ]
          if redispatches:
              lines += [f"- `{w}`" for w in redispatches]
          else:
              lines.append("_none_")
          lines += [
              "",
              "## Recovery",
              "",
              "This PR is opened automatically when critical health checks fail.",
              "It is **closed automatically** when Health Monitor reports recovery.",
              "",
              "Manual steps if it does not clear:",
              "1. Re-run **Health Monitor**",
              "2. Follow [docs/ROLLBACK.md](../docs/ROLLBACK.md)",
              "3. Actions → **Rollback data/latest** (confirm `ROLLBACK`) if needed",
              "",
          ]
          Path("/tmp/HEALTH_ALERT.md").write_text("\n".join(lines) + "\n")

          print(json.dumps(report["summary"], indent=2))
          print("critical_fail", critical_fail)
          if critical_fail:
              print("CRITICAL=true")
          else:
              print("CRITICAL=false")
          PY
          if python3 -c "import json,sys; sys.exit(0 if json.load(open('/tmp/health_report.json'))['critical_fail'] else 1)"; then
            echo "critical=true" >> "$GITHUB_OUTPUT"
          else
            echo "critical=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit healed files and health report on main
        run: |
          set -e
          git config user.name "uogw-bot"
          git config user.email "bot@midwestsds.com"
          git add data/latest data/entries status snapshots/rollback-points || true
          if git diff --staged --quiet; then
            echo "No main-branch health commit"
            exit 0
          fi
          git commit -m "ops(health): self-heal + health report $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3 4 5; do
            git fetch origin main
            git rebase origin/main || { git rebase --abort || true; git pull --rebase origin main || true; }
            if git push origin HEAD:main; then exit 0; fi
            sleep $((i * 3))
          done
          exit 1

      - name: Re-dispatch unhealthy workflows
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          if [ ! -s /tmp/redispatch.txt ]; then
            echo "No redispatches needed"
            exit 0
          fi
          while IFS= read -r wf; do
            [ -z "$wf" ] && continue
            echo "Dispatching $wf"
            curl -sS -X POST \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${{ github.repository }}/actions/workflows/${wf}/dispatches" \
              -d '{"ref":"main"}' || echo "dispatch failed: $wf"
            sleep 2
          done < /tmp/redispatch.txt

      - name: Open or update health alert PR (log the failure)
        if: steps.check.outputs.critical == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          git config user.name "uogw-bot"
          git config user.email "bot@midwestsds.com"
          BRANCH="ops/uogw-health-alert"
          git fetch origin main
          git checkout -B "$BRANCH" origin/main

          mkdir -p ops
          cp /tmp/HEALTH_ALERT.md ops/HEALTH_ALERT.md
          cp /tmp/health_report.json ops/health-report.json
          cp /tmp/health_report.json data/latest/health-report.json

          git add ops/HEALTH_ALERT.md ops/health-report.json data/latest/health-report.json
          if git diff --staged --quiet; then
            echo "Alert files unchanged; still ensure PR exists"
          else
            git commit -m "ops(health-alert): log critical health failure $(date -u +%Y-%m-%dT%H:%MZ)"
          fi
          git push -u origin "$BRANCH" --force

          # Find existing open PR for this branch
          PR_JSON=$(curl -sS -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/pulls?state=open&head=${{ github.repository_owner }}:${BRANCH}")

          PR_NUMBER=$(python3 -c "import json,sys; d=json.load(sys.stdin); print(d[0]['number'] if d else '')" <<< "$PR_JSON")
          BODY=$(cat /tmp/HEALTH_ALERT.md)

          if [ -n "$PR_NUMBER" ]; then
            echo "Updating PR #$PR_NUMBER"
            curl -sS -X POST \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${{ github.repository }}/issues/${PR_NUMBER}/comments" \
              -d "$(python3 -c "import json,sys; print(json.dumps({'body': sys.stdin.read()}))" <<< "$BODY")"
          else
            echo "Creating health alert PR"
            curl -sS -X POST \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${{ github.repository }}/pulls" \
              -d "$(python3 <<'PY'
          import json
          body = open('/tmp/HEALTH_ALERT.md').read()
          print(json.dumps({
            'title': 'UOGW health alert — critical data issue',
            'head': 'ops/uogw-health-alert',
            'base': 'main',
            'body': body + '\n\n---\n_Automated alert PR. Do not merge unless you intend to keep the alert log on main; it will be closed automatically when healthy._',
            'maintainer_can_modify': True,
          }))
          PY
          )"
          fi

      - name: Clear health alert PR when recovered
        if: steps.check.outputs.critical != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          BRANCH="ops/uogw-health-alert"
          PR_JSON=$(curl -sS -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/pulls?state=open&head=${{ github.repository_owner }}:${BRANCH}")

          PR_NUMBER=$(python3 -c "import json,sys; d=json.load(sys.stdin); print(d[0]['number'] if d else '')" <<< "$PR_JSON")
          if [ -z "$PR_NUMBER" ]; then
            echo "No open health alert PR"
            exit 0
          fi

          MSG="## Recovered\n\nHealth Monitor reports **no critical failures** at $(date -u +%Y-%m-%dT%H:%MZ).\n\nClosing this alert PR automatically. See \`data/latest/health-report.json\` on main."
          curl -sS -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/issues/${PR_NUMBER}/comments" \
            -d "$(python3 -c "import json,sys; print(json.dumps({'body': sys.stdin.read()}))" <<< "$MSG")"

          curl -sS -X PATCH \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/pulls/${PR_NUMBER}" \
            -d '{"state":"closed"}'

          echo "Closed health alert PR #$PR_NUMBER"
