<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" width="320" height="80" role="img" aria-label="Aerostratospheric">
  <defs>
    <linearGradient id="sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0a1628"/>
      <stop offset="100%" stop-color="#1a3a5c"/>
    </linearGradient>
  </defs>
  <!-- Background pill -->
  <rect x="0" y="0" width="320" height="80" rx="8" fill="url(#sky)"/>
  <!-- Stylized ascending arc / stratosphere -->
  <path d="M28 58 Q80 18 160 28 Q220 36 292 22" fill="none" stroke="#00d4ff" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M40 62 Q90 32 160 40 Q230 48 280 34" fill="none" stroke="#7dd3fc" stroke-width="1.5" stroke-linecap="round" opacity="0.7"/>
  <!-- Small high-altitude marker -->
  <circle cx="160" cy="28" r="4" fill="#00d4ff"/>
  <circle cx="160" cy="28" r="7" fill="none" stroke="#00d4ff" stroke-width="1" opacity="0.5"/>
  <!-- Wordmark -->
  <text x="160" y="68" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="600" letter-spacing="1.5" fill="#e0f2fe">AEROSTRATOSPHERIC</text>
</svg>
